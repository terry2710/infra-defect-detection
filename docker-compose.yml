# Local "structured monitoring" stack: the API plus the Prometheus/Grafana pair that scrapes and
# visualizes its /metrics. `docker compose up` gets you a working dashboard with no manual Grafana
# clicking - see monitoring/grafana/provisioning/ for how the datasource and dashboard get
# auto-loaded on startup.
#
# NOT validated by an actual `docker compose up` run - see the development note at the top of the
# Dockerfile for why (this sandbox's network blocks every container registry, Docker Hub
# included). .github/workflows/ci.yml builds and smoke-tests the api image on every push; the
# prometheus/grafana images and the provisioning wiring here still want a real run on a machine
# with normal Docker registry access before trusting them beyond "the YAML parses".
services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous viewer access + a default admin password: fine for "open localhost:3000 and
      # look at the dashboard" on a laptop, not how this would be configured behind a real
      # ingress - a production compose file would drop anonymous access and inject the admin
      # password from a secret, not a plaintext env var.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
